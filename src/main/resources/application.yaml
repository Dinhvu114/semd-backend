jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: ${PORT:8080}

# ==========================================
# MinIO Configuration
# ==========================================
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}

app:
  callback-key: ${SPRING_BOOT_CALLBACK_KEY}

  osrm:
    base-url: ${OSRM_BASE_URL}
    profile: driving
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    max-retries: 2

  simulation:
    scheduler-pool-size: 4
    default-tick-interval-ms: 1000
    location-log-interval-ms: 5000
    stale-session-threshold-seconds: 30

  otp:
    delivery-mode: ${OTP_DELIVERY_MODE}
    ttl-seconds: ${OTP_TTL_SECONDS}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS}
    registration-token-ttl-seconds: ${OTP_REGISTRATION_TOKEN_TTL_SECONDS}
    max-verification-attempts: ${OTP_MAX_VERIFICATION_ATTEMPTS}
    default-country-code: ${OTP_DEFAULT_COUNTRY_CODE}
    hash-secret: ${OTP_HASH_SECRET:${jwt.secret}}

  sms:
    endpoint: ${SMS_ENDPOINT:}
    api-token: ${SMS_API_TOKEN:}
    sender: ${SMS_SENDER:SEMD}
    message-template: ${SMS_MESSAGE_TEMPLATE}

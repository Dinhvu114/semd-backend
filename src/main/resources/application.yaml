jwt:
  secret: your-256-bit-secret-key-here-change-in-production-THAT-IS-EXTREMELY-L0NG-AND-EASY-TO-REMEMBER-WHATSOVEVER-ANYWAY-TH1S-1S-THE-SECRET-KEY-THE-QUICK-BROWN-FOX-JUMPS-OVER-THE-LAZY-DOG
  access-token-expiration: 900000
  refresh-token-expiration: 604800000 

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/semd_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway quản lý schema, JPA chỉ validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080

# ==========================================
# MinIO Configuration
# ==========================================
minio:
  endpoint: http://localhost:9000
  access-key: admin
  secret-key: admin123456
  bucket-name: ems-cad-audio

app:
  callback-key: ems-cad-callback-secret-key-789012
  otp:
    # mock: trả OTP trong response để FE/demo sử dụng; sms: gọi HTTP SMS provider và ẩn OTP
    delivery-mode: ${OTP_DELIVERY_MODE:mock}
    ttl-seconds: ${OTP_TTL_SECONDS:300}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    registration-token-ttl-seconds: ${OTP_REGISTRATION_TOKEN_TTL_SECONDS:600}
    max-verification-attempts: ${OTP_MAX_VERIFICATION_ATTEMPTS:5}
    default-country-code: ${OTP_DEFAULT_COUNTRY_CODE:+84}
    hash-secret: ${OTP_HASH_SECRET:${jwt.secret}}
  sms:
    # Adapter mặc định gửi JSON {to, sender, message} và dùng Authorization: Bearer <token>.
    # Khi chọn nhà cung cấp cụ thể, ánh xạ payload/header trong HttpSmsOtpDeliveryService.
    endpoint: ${SMS_ENDPOINT:}
    api-token: ${SMS_API_TOKEN:}
    sender: ${SMS_SENDER:SEMD}
    message-template: ${SMS_MESSAGE_TEMPLATE:Ma xac thuc SEMD cua ban la %s. Ma co hieu luc trong 5 phut.}

name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests -q

      - name: Build Docker image
        run: docker build -t semd-backend:ci .

      - name: Verify image starts
        run: |
          docker run -d --name test-container \
            -e DB_URL=jdbc:postgresql://localhost:5432/semd_db \
            -e DB_USERNAME=postgres \
            -e DB_PASSWORD=test \
            -e JWT_SECRET=test-secret-key-minimum-32-characters \
            -e MINIO_ACCESS_KEY=test \
            -e MINIO_SECRET_KEY=test \
            -e SPRING_BOOT_CALLBACK_KEY=test \
            semd-backend:ci || true
          sleep 5
          docker rm -f test-container || true
jwt:
  secret: your-256-bit-secret-key-here-change-in-production-THAT-IS-EXTREMELY-L0NG-AND-EASY-TO-REMEMBER-WHATSOVEVER-ANYWAY-TH1S-1S-THE-SECRET-KEY-THE-QUICK-BROWN-FOX-JUMPS-OVER-THE-LAZY-DOG
  access-token-expiration: 900000
  refresh-token-expiration: 604800000 

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/semd_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway quản lý schema, JPA chỉ validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080

# ==========================================
# MinIO Configuration
